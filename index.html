<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AllRoundel</title>
</head>
<center>
<body>

  <svg id="roundel" width="400" height="400" viewBox="0 0 400 400">
  <!-- Ring -->
  <circle id="ring"
          cx="200" cy="200" r="150"
          fill="none"
          stroke="#DA291C"
          stroke-width="60" />

  <!-- Bar (station signage proportions) -->
  <rect id="bar"
        x="0" y="165"
        width="500" height="70"
        fill="#003688" />

  <!-- Text -->
  <text id="label"
        x="200" y="210"
        text-anchor="middle"
        font-size="38"
        font-family="Arial, sans-serif"
        fill="white">
    UNDERGROUND
  </text>
</svg>




  <br><br>

  <!-- Controls -->
  <div class="controls">
    <label for="ringColor">Ring Colour:</label>
    <input type="color" id="ringColor" value="#DA291C">

    <label for="barColor">Bar Colour:</label>
    <input type="color" id="barColor" value="#003688">

    <label for="textColor">Text Colour:</label>
    <input type="color" id="textColor" value="#ffffff">

    <label for="textInput">Label:</label>
    <input type="text" id="textInput" value="UNDERGROUND">

    &nbsp;
    <button id="underground">Underground</button>
    &nbsp;
    <button id="download">Download SVG</button>
    <button id="downloadPng">Download PNG</button>
  </div>


  <script src="script.js"></script>
  </center>
  <center>
    <p>Copyright 2026 Lumanesence - All Rights Reserved</p>
    <p>This project is open source - check it out for yourself <a href="https://github.com/lumanesence/allroundel">here!</a></p>
  </center>
</body>
</html>
